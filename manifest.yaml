# Inventario REAL del qa-kit — fuente de verdad para los instaladores.
# Sin drift: lista solo lo que existe en el repo.
version: "2.1.0-explore-guion"
description: "Kit acotado a EXPLORACIÓN de una URL viva (pruebas E2E): URL-smoke + GUION de pasos + cobertura de AC. Trackers: local + azure-devops."
status: "explore-only"   # Se retiró el pipeline de 'QA del código' (capas/BDD/generación) y los trackers jira/github.

core:
  tracker_adapter:
    - core/tracker-adapter/CONTRACT.md
    - core/tracker-adapter/tracker-adapter.mjs
    - core/tracker-adapter/index.mjs           # factory: solo local + azure-devops
  agents:
    qa-orchestrator:
      - core/agents/qa-orchestrator/AGENT.md    # ciclo de exploración de URL → sink
  skills:
    url-explore:
      - core/skills/url-explore/SKILL.md        # explora una URL viva (Playwright): status/consola/captura
  templates:
    local:
      - templates/local/README.md

adapters:
  trackers:
    local:
      - adapters/trackers/local/local-adapter.mjs
      - adapters/trackers/local/README.md
    azure-devops:
      - adapters/trackers/azure-devops/azure-devops-adapter.mjs   # contrato explore-only (preflight/getWorkItem/publishEvidence/adjuntos)
      - adapters/trackers/azure-devops/ado-rest.mjs               # cliente REST (rutas/auth)
      - adapters/trackers/azure-devops/ado-html.mjs               # parse de la HU + render del resumen
      - adapters/trackers/azure-devops/tc-match.mjs               # captura → Task hijo (adjuntos)
      - adapters/trackers/azure-devops/README.md
  shared:
    - adapters/_shared/http-retry.mjs                             # transporte HTTP default con reintento ante fallos de red transitorios

profiles:
  - profiles/default.yaml
  presets:
    - profiles/presets/azure-devops.yaml
  overlays:
    - profiles/overlays/flit.yaml

runtime:
  profile:
    - runtime/profile/yaml-lite.mjs
    - runtime/profile/resolve-profile.mjs
  runners:
    - runtime/runners/explore.mjs         # única capa: URL-smoke (appUrl) o GUION E2E (flow)
    - runtime/runners/explore-steps.mjs   # registro de PASOS del guion (núcleo) + interpolación ${VAR}
    - runtime/runners/explore-flow.mjs    # ejecutor del guion: pasos en orden sobre una sesión
  pr:                                     # QA guiado por PR (determinista, sin IA): lee el PR del dev → qué validar
    - runtime/pr/pr-reader.mjs            # lee un PR de GitHub (API pública): archivos, test plan, HU/Feature vinculados
    - runtime/pr/classify-files.mjs       # clasifica los archivos cambiados: frontend-visible (E2E) vs backend/infra/docs
    - runtime/pr/scope-matrix.mjs         # expande AC + áreas en escenarios (ISTQB): negativa/límite/RBAC/error/regresión, dev vs gap-QA
    - runtime/pr/brief.mjs                # ensambla el brief de validación (markdown + HTML + fragmento para ADO)
    - runtime/pr/scaffold.mjs             # andamiaje determinista: AC → esqueleto de guion (placeholders a completar)
  orchestrator: runtime/orchestrator.mjs  # backbone slim: resolve-profile → adapter → explore → publishEvidence
  cli: runtime/cli.mjs                    # entrypoint: --url <https://app> (URL-smoke) | --flow <archivo> (guion E2E)
  delivery_build: runtime/delivery/build.mjs  # empaqueta core/ a cada target
  evidence:
    - runtime/evidence/local-sink.mjs     # reporte md+html autocontenido (capturas embebidas como data-URI)
    - runtime/evidence/ac-coverage.mjs    # matriz de cobertura de AC (puro): case.ac × declaredAcs → cubierto/fallo/sin cubrir
  smoke_test: runtime/smoke-test.mjs      # 30 casos (resolver + explore-suite + pr-suite), offline

delivery:        # targets generados desde core/ por runtime/delivery/build.mjs
  generator: runtime/delivery/build.mjs
  targets: [plain, claude-code, cursor]   # salida en dist/<target>/ (no versionada)
  docs:
    - delivery/cursor/README.md
    - delivery/claude-code/README.md
    - delivery/plain/README.md

webapp:          # UX web multitenant (Next.js, :4312) — el producto laboral
  note: "Servicio multitenant (Postgres+RLS, auth, cifrado). Explorar URL + GUION E2E (constructor visual, import/export JSON, guion por HU, fan-out de Feature, panel de AC + cobertura) + QA GUIADO POR PR (asistente: paso «Desde un PR» → detecta HU/Feature por tipo real de ADO → brief de qué validar + andamiaje + publicar + correr guiones). Sin IA. Ver docs/MULTITENANT.md."

packs:           # opcionales, NO instalados por defecto
  dev-side:
    - packs/dev-side/README.md
